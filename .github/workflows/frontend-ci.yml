name: frontend-ci
on:
  pull_request:
    paths: ['frontend/**', 'docs/openapi/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [develop, main]
    paths: ['frontend/**', 'docs/openapi/**']
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Guard - no AI provider references in the frontend (CLAUDE.md hard rule 2)
        run: |
          if grep -rniE "ANTHROPIC|api\.anthropic\.com" src public 2>/dev/null; then
            echo "AI provider reference found in frontend/"; exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # TODO(infra): regenerate API types (pnpm gen:api) and fail on diff once openapi.v1.json is committed.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
