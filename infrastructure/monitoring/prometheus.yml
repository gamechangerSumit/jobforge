global:
  scrape_interval: 15s
scrape_configs:
  - job_name: jobforge-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:9091']   # management port, reachable only on jobforge-net (not published to the host)
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
